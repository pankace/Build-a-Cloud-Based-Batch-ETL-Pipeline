name: Deploy ETL Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v0.2.0
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Deploy Extract Function
        run: |
          cd src/extract_function
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/extract-function
          gcloud run deploy extract-function --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/extract-function --platform managed --region us-central1 --allow-unauthenticated

  deploy-load:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v0.2.0
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Deploy Load Function
        run: |
          cd src/load_function
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/load-function
          gcloud run deploy load-function --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/load-function --platform managed --region us-central1 --allow-unauthenticated